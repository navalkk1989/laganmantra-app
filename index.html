body{background:var(--bg)}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--ov,transparent),var(--ov,transparent)),var(--bgi,none) center/cover}
.lgo{display:inline-block;background:var(--lg) center/contain no-repeat #fcf4e6;border-radius:10px;vertical-align:middle}
#side{position:fixed;left:0;top:40%;z-index:8}
.sd{background:linear-gradient(135deg,#8b0a24,#c8901f);color:#fff;border-radius:0 16px 16px 0;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sd small{opacity:.92}.sd b{font-size:19px;display:block;letter-spacing:.4px}.sd a{color:#fff}
.sb{display:flex;gap:6px;margin-top:8px}.sb a{flex:1;text-align:center;padding:8px 10px;border-radius:99px;font-weight:700;font-size:13px}.sb .ca{background:#fff;color:#8b0a24}.sb .wa{background:#25D366}
@media(max-width:700px){#side{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:8px}.sd{border-radius:16px;padding:8px 10px}.sd b{font-size:15px}}
.bc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-right:auto}.bc b{margin-right:0!important}.ph1{display:flex;align-items:center;gap:8px}.pn{font-size:23px;font-weight:700;color:var(--p);letter-spacing:.4px}.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.ib svg{width:20px;height:20px;fill:#fff}.ib.ca{background:#8b0a24}.ib.wa{background:#25D366}a[href^="tel"],a[href*="wa.me"],.pn,.hl{text-decoration:none!important}@media(max-width:700px){.pn{font-size:20px}}.pic{position:relative}.pco{position:absolute;left:12px;right:12px;bottom:12px;background:var(--c);border-radius:16px;padding:10px 12px;box-shadow:0 8px 22px rgba(0,0,0,.25)}.pco small{display:block;color:var(--m);margin-bottom:4px}
#bot{width:auto!important;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#8b0a24,#c8901f);color:#fff;font-size:27px;box-shadow:0 8px 24px rgba(139,10,36,.45);cursor:pointer;position:relative;padding:0;animation:pl 2.4s infinite}
.fab:after{content:"";position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:#25D366;border:2px solid #fff}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(200,144,31,.55)}70%{box-shadow:0 0 0 16px rgba(200,144,31,0)}100%{box-shadow:0 0 0 0 rgba(200,144,31,0)}}
.cw{width:350px;max-width:92vw;height:min(520px,75vh);display:flex;flex-direction:column;background:var(--c);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.38);border:1px solid var(--l);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ch2{background:linear-gradient(135deg,#8b0a24,#c8901f);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.av2{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:23px}
.ch2 b{display:block;font-size:15px}.ch2 small{opacity:.95;display:flex;align-items:center;gap:5px}.ch2 small:before{content:"";width:8px;height:8px;border-radius:50%;background:#25D366}
.cx{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;border:0;width:30px;height:30px;padding:0;border-radius:50%;font-size:14px}
.cm{flex:1;overflow:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.mb{max-width:84%;padding:9px 13px;border-radius:16px;font-size:13.5px;animation:up .2s}.mb.bt{background:var(--c);border:1px solid var(--l);border-bottom-left-radius:4px;align-self:flex-start}.mb.u{background:linear-gradient(135deg,#8b0a24,#c8901f);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.ty{display:flex;gap:4px;padding:13px 15px}.ty i{width:7px;height:7px;border-radius:50%;background:var(--m);animation:bn 1.2s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes bn{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.qr{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);border-top:1px solid var(--l)}.qr button{white-space:nowrap;background:var(--c);color:var(--p);border:1px solid var(--p);padding:6px 12px;font-size:12px;font-weight:500}
.ci{display:flex;gap:8px;padding:10px;border-top:1px solid var(--l);background:var(--c)}.ci input{margin:0;border-radius:99px;flex:1}.ci button{width:42px;height:42px;padding:0;border-radius:50%;font-size:16px}
.hero2{position:relative;min-height:min(86vh,680px);overflow:hidden;display:flex;align-items:center;background:#2b1a24}
.hsl{position:absolute;inset:0}.sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}.sl.on{opacity:1;animation:kb 9s ease-out forwards}.sl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.hov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.1) 62%,rgba(0,0,0,.22));z-index:2}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;padding:44px 0 56px}
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.38);border-radius:24px;padding:20px;color:#fff;text-shadow:none}.glass label{color:#fff}.glass select,.glass input{background:rgba(255,255,255,.92);color:#2b1a24}
.ha{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:42px;height:42px;padding:0;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:24px;line-height:1}
.hd{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:4}.hd i{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.55);cursor:pointer;transition:.3s}.hd i.on{width:28px;background:#fff}
.sec{text-align:center;margin:34px 0 16px;font-size:clamp(24px,4vw,34px)}
.mq{overflow:hidden;padding:7px 0}.mt{display:flex;gap:14px;width:max-content;animation:mq 70s linear infinite}.mt.mrev{animation-direction:reverse}.mq:hover .mt{animation-play-state:paused}
.mi{height:250px;flex:none;border-radius:20px;background-size:cover;background-position:center 25%;box-shadow:0 8px 22px rgba(0,0,0,.2)}@keyframes mq{to{transform:translateX(-50%)}}
.reels{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:flex-end}.rv{border-radius:24px;overflow:hidden;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.28);background:#000}.rv.p{width:250px;aspect-ratio:9/16}.rv.l{width:min(420px,92vw);aspect-ratio:16/9}.rv video{display:block;width:100%;height:100%;object-fit:cover}.rv .tx{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;color:#fff;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.ss{overflow:hidden}.ssl{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 1.3s ease}.ssl.on{opacity:1}
.ban{position:relative;height:190px}.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;font-weight:700;font-size:18px;padding:30px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.pco{z-index:2}
@media(max-width:700px){.hg{grid-template-columns:1fr}.glass{display:none}.ha{display:none}.hero2{min-height:520px}.mi{height:200px}}
.crown{vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(90,50,0,.55));animation:flt 3s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-2px) rotate(-3deg)}}

const R={
greet:()=>X(`Hello${cx.name?" "+cx.name:me?" "+me.name:""}! 🙏 I'm Riya from LaganMantra. How can I help you today?`,`Namaste${cx.name?" "+cx.name:me?" "+me.name:""} ji! 🙏 Main Riya hu, LaganMantra se. Bataiye, main aapki kya madad kar sakti hu?`,`नमस्ते${cx.name?" "+cx.name:me?" "+me.name:""} जी! 🙏 मैं रिया हूँ, लगनमंत्र से। बताइए, मैं आपकी क्या मदद कर सकती हूँ?`),
how:()=>X("I'm doing great, thank you for asking! 😊 How can I help you?","Main bilkul theek hu, poochne ke liye shukriya! 😊 Aapki kya madad karu?","मैं बिल्कुल ठीक हूँ, पूछने के लिए शुक्रिया! 😊 मैं आपकी क्या मदद करूँ?"),

bye:()=>X("Thank you for visiting LaganMantra. Wishing you a lovely partner soon! 💍","LaganMantra aane ke liye dhanyavaad. Aapko jaldi hi achha jeevansathi mile! 💍","लगनमंत्र आने के लिए धन्यवाद। आपको जल्द ही अच्छा जीवनसाथी मिले! 💍"),

register:()=>X("Registering is easy: tap <b>Register Free</b>, verify your mobile with OTP, fill your details (profile for, DOB, location, religion, caste, height, education...), add photos, set your <b>partner preferences</b> and accept the Terms. Only 18+ can join.","Register karna aasaan hai: <b>Register Free</b> dabaiye, mobile OTP se verify kijiye, details bhariye (profile kiske liye, DOB, location, dharm, jati, height, education...), photos jodiye, <b>partner preferences</b> chuniye aur Terms accept kijiye. Sirf 18+ log judd sakte hain.","रजिस्टर करना आसान है: <b>Register Free</b> दबाइए, मोबाइल OTP से वेरिफाई कीजिए, जानकारी भरिए (प्रोफाइल किसके लिए, जन्मतिथि, शहर, धर्म, जाति, कद, शिक्षा...), फोटो जोड़िए, <b>पार्टनर पसंद</b> चुनिए और शर्तें मानिए। केवल 18+ लोग जुड़ सकते हैं।"),
login:()=>X("Login is with your mobile number + OTP. Enter your 10-digit number, tap Send OTP and type the code. If the OTP doesn't arrive, wait a minute and resend, or ask me to connect you with our team.","Login mobile number + OTP se hota hai. 10 digit number daaliye, Send OTP dabaiye aur code likhiye. OTP na aaye to ek minute ruk kar dobara bhejiye, ya main aapko team se connect kar dun.","लॉगिन मोबाइल नंबर + OTP से होता है। 10 अंकों का नंबर डालिए, Send OTP दबाइए और कोड लिखिए। OTP न आए तो एक मिनट रुककर दोबारा भेजिए, या मैं आपको टीम से जोड़ दूँ।"),
age:()=>X("LaganMantra is only for members aged <b>18 or above</b>. Registration below 18 is refused.","LaganMantra sirf <b>18 saal ya usse zyada</b> umar ke members ke liye hai. 18 se kam umar par registration nahi hota.","लगनमंत्र केवल <b>18 वर्ष या उससे अधिक</b> आयु के सदस्यों के लिए है। 18 से कम आयु पर रजिस्ट्रेशन नहीं होता।"),
photo:()=>X("You can upload multiple photos or click one with the camera. Choose to show photos to <b>everyone</b> or <b>only after a request is accepted</b>. You can change it any time in Profile > Edit profile.","Aap kai photos upload kar sakte hain ya camera se kheench sakte hain. Photos <b>sabko</b> dikhani hain ya <b>request accept hone ke baad</b> — ye aap chun sakte hain. Profile > Edit profile me kabhi bhi badal sakte hain.","आप कई फोटो अपलोड कर सकते हैं या कैमरे से खींच सकते हैं। फोटो <b>सबको</b> दिखानी हैं या <b>रिक्वेस्ट एक्सेप्ट होने के बाद</b> — यह आप चुन सकते हैं। Profile > Edit profile में कभी भी बदलें।"),
privacy:()=>X("Your mobile number and email stay <b>hidden</b> unless you tick Show my mobile / email. Photos follow your privacy setting too.","Aapka mobile number aur email <b>chhupa rehta hai</b> jab tak aap Show my mobile / email na chunen. Photos bhi aapki privacy setting ke hisaab se dikhti hain.","आपका मोबाइल नंबर और ईमेल <b>छुपा रहता है</b> जब तक आप Show my mobile / email न चुनें। फोटो भी आपकी प्राइवेसी सेटिंग के अनुसार दिखती हैं।"),
match:()=>X("After registration we suggest profiles <b>as per your partner preferences</b> (religion, caste, age, Manglik, education, complexion, height). Profiles matching everything come first, then close matches. Edit preferences anytime.","Registration ke baad aapko <b>aapki partner preferences</b> ke hisaab se profiles dikhte hain (dharm, jati, umar, Manglik, education, complexion, height). Jo sabse milte hain wo pehle, phir close matches. Preferences kabhi bhi badal sakte hain.","रजिस्ट्रेशन के बाद आपको <b>आपकी पार्टनर पसंद</b> के अनुसार प्रोफाइल दिखती हैं (धर्म, जाति, आयु, मांगलिक, शिक्षा, रंग, कद)। जो सबसे मिलती हैं वे पहले, फिर करीबी मैच। पसंद कभी भी बदल सकते हैं।"),
search:()=>X("Use <b>Search</b> to filter by age, religion, caste, state, city, mother tongue, occupation, Manglik and nearby distance.","<b>Search</b> me aap umar, dharm, jati, state, city, mother tongue, occupation, Manglik aur nearby distance se filter kar sakte hain.","<b>Search</b> में आप आयु, धर्म, जाति, राज्य, शहर, मातृभाषा, व्यवसाय, मांगलिक और नज़दीकी दूरी से फ़िल्टर कर सकते हैं।"),
interest:()=>X("Swipe a profile <b>right</b> (or tap Send) to send an interest and <b>left</b> to decline. The other person gets a notification and can accept or reject from Requests.","Profile ko <b>right swipe</b> (ya Send) karne par interest chala jata hai aur <b>left swipe</b> par decline. Doosre user ko notification milti hai aur wo Requests me accept ya reject kar sakta hai.","प्रोफाइल को <b>राइट स्वाइप</b> (या Send) करने पर रुचि भेजी जाती है और <b>लेफ्ट स्वाइप</b> पर अस्वीकार। दूसरे सदस्य को नोटिफिकेशन मिलता है और वह Requests में स्वीकार या अस्वीकार कर सकता है।"),
chat:()=>X("Chat opens only after <b>both</b> members accept the request. It's a premium feature. Abusive or sexual language leads to an automatic block.","Chat tab hi khulti hai jab <b>dono</b> members request accept kar lein. Ye premium feature hai. Gaali ya sexual baat karne par account apne aap block ho jata hai.","चैट तभी खुलती है जब <b>दोनों</b> सदस्य रिक्वेस्ट स्वीकार कर लें। यह प्रीमियम सुविधा है। गाली या अश्लील बातचीत पर अकाउंट अपने आप ब्लॉक हो जाता है।"),
plans:()=>X("Our premium plans: "+pt()+". "+(D.s.free?"Premium is <b>free for everyone</b> right now! 🎉":"Open <b>👑 Premium</b> to buy a plan."),"Hamare premium plans: "+pt()+". "+(D.s.free?"Abhi premium <b>sabke liye free</b> hai! 🎉":"Plan lene ke liye <b>👑 Premium</b> kholiye."),"हमारे प्रीमियम प्लान: "+pt()+"। "+(D.s.free?"अभी प्रीमियम <b>सबके लिए मुफ़्त</b> है! 🎉":"प्लान लेने के लिए <b>👑 Premium</b> खोलिए।")),

payment:()=>X("Open <b>👑 Premium > Pay now</b>. Pay by scanning the company QR, or by UPI, card, net banking, wallet or bank transfer. Your plan activates for its full validity right after payment.","<b>👑 Premium > Pay now</b> kholiye. Company QR scan karke, ya UPI, card, net banking, wallet ya bank transfer se pay kar sakte hain. Payment ke turant baad plan poori validity ke saath active ho jata hai.","<b>👑 Premium > Pay now</b> खोलिए। कंपनी का QR स्कैन करके, या UPI, कार्ड, नेट बैंकिंग, वॉलेट या बैंक ट्रांसफर से भुगतान करें। भुगतान के तुरंत बाद प्लान पूरी अवधि के लिए चालू हो जाता है।"),
expiry:()=>X("Your plan expiry date shows on your Profile and a reminder appears 30 days before it ends. Buying again adds days on top of your remaining validity.","Aapke plan ki expiry date Profile me dikhti hai aur khatam hone se 30 din pehle reminder aata hai. Dobara plan lene par bachi hui validity me din jud jate hain.","आपके प्लान की समाप्ति तिथि प्रोफाइल में दिखती है और खत्म होने से 30 दिन पहले रिमाइंडर आता है। दोबारा प्लान लेने पर बची अवधि में दिन जुड़ जाते हैं।"),
edit:()=>X("Go to <b>Profile > Edit profile</b> to change your details, height, weight, photos, bio-data, privacy and partner preferences.","<b>Profile > Edit profile</b> me jaakar aap details, height, weight, photos, bio-data, privacy aur partner preferences badal sakte hain.","<b>Profile > Edit profile</b> में जाकर आप जानकारी, कद, वज़न, फोटो, बायोडाटा, प्राइवेसी और पार्टनर पसंद बदल सकते हैं।"),
safety:()=>X("We auto-block accounts for abusive/sexual chat or adult photos. Use <b>Report</b> on any profile. Never send money to anyone you meet online. For a complaint I can connect you to our team.","Gaali, sexual chat ya adult photo par account apne aap block ho jata hai. Kisi bhi profile par <b>Report</b> dabaiye. Online mile kisi ko kabhi paise na bhejein. Shikayat ke liye main aapko team se connect kar sakti hu.","गाली, अश्लील चैट या एडल्ट फोटो पर अकाउंट अपने आप ब्लॉक हो जाता है। किसी भी प्रोफाइल पर <b>Report</b> दबाइए। ऑनलाइन मिले किसी को पैसे कभी न भेजें। शिकायत के लिए मैं आपको टीम से जोड़ सकती हूँ।"),
biodata:()=>X("You can attach your bio-data (PDF/Doc) during registration or in Edit profile.","Bio-data (PDF/Doc) aap registration ke time ya Edit profile me attach kar sakte hain.","बायोडाटा (PDF/Doc) आप रजिस्ट्रेशन के समय या Edit profile में जोड़ सकते हैं।"),
del:()=>X("To delete your account, please share a request via our team – I can connect you now.","Account delete karwane ke liye team se request bhejni hogi – main abhi aapko connect kar sakti hu.","अकाउंट डिलीट करवाने के लिए टीम को अनुरोध भेजना होगा – मैं अभी आपको जोड़ सकती हूँ।"),
terms:()=>X("Our Terms & Conditions and Privacy Policy are linked in the footer. They cover eligibility, safe conduct, payments, privacy and grievance redressal.","Terms & Conditions aur Privacy Policy footer me hain. Inme eligibility, safe conduct, payment, privacy aur shikayat nivaran ki jaankari hai.","नियम व शर्तें और प्राइवेसी पॉलिसी फुटर में हैं। इनमें पात्रता, सुरक्षित व्यवहार, भुगतान, प्राइवेसी और शिकायत निवारण की जानकारी है।"),
manglik:()=>X("You can mention Manglik status in your profile and choose Manglik / Non-Manglik / Any in your preferences, so matches respect it.","Aap profile me Manglik status bata sakte hain aur preferences me Manglik / Non-Manglik / Any chun sakte hain, taaki matches usi ke hisaab se aayen.","आप प्रोफाइल में मांगलिक स्थिति बता सकते हैं और पसंद में मांगलिक / गैर-मांगलिक / कोई भी चुन सकते हैं, ताकि मैच उसी के अनुसार आएँ।"),
nri:()=>X("Yes, NRI members are welcome. Select your NRI status in the profile and use it as a filter while searching.","Ji haan, NRI members ka swagat hai. Profile me NRI status chuniye aur search me use filter ki tarah lagaiye.","जी हाँ, NRI सदस्यों का स्वागत है। प्रोफाइल में NRI स्थिति चुनिए और सर्च में फ़िल्टर की तरह उपयोग कीजिए।"),
contact:()=>X(cpBot("en")+" I can also arrange a callback from our team.",cpBot("hl")+" Main team se callback bhi arrange kar sakti hu.",cpBot("hi")+" मैं टीम से कॉलबैक भी करवा सकती हूँ।"),
status:()=>{if(!me)return X("Please login first and I can tell you your plan and request status.","Pehle login kijiye, phir main aapka plan aur request status bata sakti hu.","पहले लॉगिन कीजिए, फिर मैं आपका प्लान और रिक्वेस्ट स्टेटस बता सकती हूँ।");const p=D.req.filter(r=>r.t==me.id&&r.st=="p").length,a=D.req.filter(r=>r.st=="acc"&&[r.f,r.t].includes(me.id)).length,pl2=me.exp>Date.now()?new Date(me.exp).toDateString():D.s.free?"Free promo":"No plan";return X(`${me.name}, your plan: <b>${pl2}</b>. Pending requests received: <b>${p}</b>. Accepted connections: <b>${a}</b>.`,`${me.name} ji, aapka plan: <b>${pl2}</b>. Aapko mili pending requests: <b>${p}</b>. Accepted connections: <b>${a}</b>.`,`${me.name} जी, आपका प्लान: <b>${pl2}</b>। आपको मिली लंबित रिक्वेस्ट: <b>${p}</b>। स्वीकृत कनेक्शन: <b>${a}</b>।`)},
issue:()=>X("I'm really sorry for the trouble. 🙏 Please tell me a little more, or I can have our team call you right away.","Takleef ke liye mujhe bahut khed hai. 🙏 Thoda aur bataiye, ya main abhi team se aapko call karwa deti hu.","असुविधा के लिए मुझे बहुत खेद है। 🙏 थोड़ा और बताइए, या मैं अभी टीम से आपको कॉल करवा देती हूँ।"),
human:()=>X("Sure! I'll connect you with our team. Please share your name and mobile number – we verify it with an OTP.","Zaroor! Main aapko hamari team se connect karti hu. Apna naam aur mobile number bataiye – hum use OTP se verify karte hain.","ज़रूर! मैं आपको हमारी टीम से जोड़ती हूँ। अपना नाम और मोबाइल नंबर बताइए – हम OTP से वेरिफाई करते हैं।"),
unk:()=>X("Sorry, I didn't fully understand that. Could you tell me a bit more – is it about registration, plans, photos, chat or something else? Or I can connect you with our team.","Maaf kijiye, main poori tarah samajh nahi payi. Kya aap thoda aur bata sakte hain – registration, plans, photos, chat ya kuch aur? Ya main aapko team se connect kar sakti hu.","क्षमा कीजिए, मैं पूरी तरह समझ नहीं पाई। क्या आप थोड़ा और बता सकते हैं – रजिस्ट्रेशन, प्लान, फोटो, चैट या कुछ और? या मैं आपको टीम से जोड़ सकती हूँ।"),

["In short","<b>All payments made on LaganMantra are final and non-refundable.</b> The only exception is a <b>duplicate payment</b> – when you are charged more than once for the same plan. In that case the extra amount is refunded in full.<br><span style='color:var(--m)'>Saar: LaganMantra par kiya gaya har payment non-refundable hai. Refund sirf tab milega jab ek hi plan ke liye galti se do baar payment kat gaya ho (duplicate payment).</span>"],
["1. What counts as a duplicate payment","A duplicate payment means the same premium plan was paid for more than once for the same LaganMantra account at around the same time – for example because of a network error, a double tap on the pay button, or a bank/UPI glitch – and the money was received by us more than once. Only the extra (duplicate) amount is refunded; the first payment stays and your plan remains active."],

["5. Failed or pending transactions","If money is debited but the payment fails or is not received by us, it is not a refund case – your bank or the payment gateway reverses such amounts automatically, usually within 5–7 working days. If your plan is not activated after a successful payment, contact us and we will activate it."],
["6. Cancellation","<b>Once a payment is made, the plan cannot be cancelled and the amount cannot be refunded.</b> You may stop using LaganMantra at any time – your plan simply stays active until its expiry date. Deleting your account or not using the plan does not make it cancellable or refundable, and there is no partial (pro-rata) refund. The only refund is for a duplicate payment, as explained in points 1–3 above.<br><span style='color:var(--m)'>Saar: Payment karne ke baad plan cancel nahi hota aur paisa wapas nahi milta. Refund sirf duplicate payment par milega (upar point 1–3).</span>"],
