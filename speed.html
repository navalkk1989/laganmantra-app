<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaganMantra speed check</title>
<style>:root{--c:#fff;--t:#2b1a24;--m:#7a6571;--p:#8b0a24}@media(prefers-color-scheme:dark){:root{--c:#1d1418;--t:#f3e9ee;--m:#b9a6ae}}
body{margin:0;background:var(--c);color:var(--t);font:15px/1.5 system-ui,sans-serif;padding:16px}h1{font-size:20px;color:var(--p);margin:4px 0 12px}
table{width:100%;max-width:560px;border-collapse:collapse}td{padding:8px 6px;border-bottom:1px solid rgba(128,128,128,.25);vertical-align:top}td:first-child{color:var(--m);width:48%}
.v{font-weight:700}.ok{color:#1b7f3b}.bad{color:#c62828}.box{max-width:560px;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(139,10,36,.08)}button{margin-top:12px;padding:10px 18px;border:0;border-radius:99px;background:var(--p);color:#fff;font-weight:700}</style></head>
<body><h1>⚡ LaganMantra – speed check</h1><table id=t></table><div class=box id=v>⏳ Checking… please wait (up to 1 minute)</div><button onclick="location.reload()">🔄 Check again</button>
<p style="color:var(--m);font-size:13px">Take a screenshot of this page and send it to support.</p>
<script>
const T=document.getElementById("t"),row=(a,b,c)=>{const r=T.insertRow();r.insertCell().textContent=a;const d=r.insertCell();d.className="v "+(c||"");d.textContent=b;return d};
const base=location.href.replace(/[^/]*$/,"");
async function get(path,label){const t0=performance.now();let first=0,n=0;const cell=row(label,"…");
 try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);const r=await fetch(base+path+(path.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal});first=performance.now()-t0;
  const rd=r.body.getReader();for(;;){const x=await rd.read();if(x.done)break;n+=x.value.length;cell.textContent=Math.round(n/1024)+" KB…"}clearTimeout(to);
  const all=(performance.now()-t0)/1000,sp=n/1024/Math.max(.05,(performance.now()-t0-first)/1000);
  cell.textContent=all.toFixed(1)+" s · "+Math.round(n/1024)+" KB · first reply "+(first/1000).toFixed(1)+" s · "+Math.round(sp)+" KB/s";cell.className="v "+(all<4?"ok":"bad");return{ok:r.ok,all,first:first/1000,sp,n}}
 catch(e){cell.textContent="FAILED after "+((performance.now()-t0)/1000).toFixed(1)+" s ("+e.name+")";cell.className="v bad";return{ok:false,all:99,first:99,sp:0,n}}}
(async()=>{const c=navigator.connection||{};row("Website address",location.host);row("Time",new Date().toLocaleString());row("Internet (browser says)",(c.effectiveType||"?")+(c.downlink?" · "+c.downlink+" Mbps":""));
 const v=await get("version.json","Tiny file (version)");const pg=await get("index.html","Main page (~550 KB)");const im=await get("lm-g1.webp","Photo (~130 KB)");
 let s="";if(!v.ok&&!pg.ok)s="❌ The website address could not be reached at all. Check the domain (DNS) settings or the internet connection.";
 else if(v.first>3)s="🐢 The website takes "+v.first.toFixed(1)+" s just to answer. This is the domain / GitHub connection (DNS or HTTPS), not the website code.";
 else if(pg.sp<60)s="🐢 The connection is slow ("+Math.round(pg.sp)+" KB/s). The main page needs about "+Math.round(550/Math.max(1,pg.sp))+" s on this internet. Try another network (mobile data / Wi-Fi) to compare.";
 else s="✅ The website is downloading fast here ("+pg.all.toFixed(1)+" s for the main page). If the site still does not open, press Ctrl + Shift + R on the website.";
 document.getElementById("v").textContent=s})();
</script></body></html>
